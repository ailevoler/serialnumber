<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Offline — RBNW Wallet</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #fff;
         font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif; color: #0d1b33; text-align: center; }
  main { padding: 32px 24px; max-width: 340px; }
  img { width: 88px; height: auto; margin-bottom: 22px; }
  h1 { font-size: 21px; margin: 0 0 8px; }
  p { color: #5b6b80; font-size: 14px; line-height: 1.5; margin: 0 0 24px; }
  button { width: 100%; min-height: 52px; border: none; border-radius: 12px; font: inherit; font-size: 15px; font-weight: 700; color: #fff;
           background: linear-gradient(135deg, #0a3570 0%, #0f4c92 55%, #3fa344 130%); cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="assets/img/rbnw-r.png" alt="RBNW">
  <h1>You're offline</h1>
  <p>Check your mobile data or Wi-Fi. Your balance and transactions are safe and will show again once you're connected.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
